<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<style>
body{font-family:Arial;background:#f5f5f5;padding:20px;}
.box{background:white;padding:20px;border-radius:10px;max-width:400px;margin:auto;}
input{width:100%;padding:10px;margin:8px 0;}
button{width:100%;padding:10px;background:#0057b8;color:white;border:none;}
</style>
</head>
<body>

<div class="box">
<h2>Tambah Produk</h2>

<input id="name" placeholder="Nama Produk">
<input id="price" placeholder="Harga">
<input id="image" placeholder="URL Gambar">
<input id="category" placeholder="Kategori">

<button onclick="addProduct()">Simpan</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, addDoc, collection } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "ISI_API_KEY_KAMU",
  authDomain: "musicos-studio.firebaseapp.com",
  projectId: "musicos-studio",
  storageBucket: "musicos-studio.appspot.com",
  messagingSenderId: "1025793334771",
  appId: "1:1025793334771:web:b1be41ed205ee0aec80686"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

window.addProduct = async function(){
  const user = auth.currentUser;

  if(!user){
    alert("Harus login dulu!");
    window.location.href = "login.html";
    return;
  }

  await addDoc(collection(db, "products"), {
    name: document.getElementById("name").value,
    price: document.getElementById("price").value,
    image: document.getElementById("image").value,
    category: document.getElementById("category").value
  });

  alert("Produk berhasil ditambahkan!");
};
</script>

</body>
</html>
