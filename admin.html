<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Roman Yosi Market</title>

<style>
body{
  font-family:Arial;
  background:#f5f5f5;
  padding:20px;
}

.box{
  background:white;
  padding:20px;
  border-radius:12px;
  max-width:450px;
  margin:auto;
  box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h2{
  text-align:center;
}

input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:1px solid #ccc;
  border-radius:6px;
}

button{
  width:100%;
  padding:10px;
  background:#0057b8;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

button:hover{
  background:#004494;
}

#status{
  text-align:center;
  margin-top:10px;
  font-size:13px;
}
</style>
</head>

<body>

<div class="box">
<h2>Tambah Produk</h2>

<input id="name" placeholder="Nama Produk">
<input id="price" placeholder="Harga">
<input id="image" placeholder="URL Gambar">
<input id="category" placeholder="Kategori">

<button onclick="addProduct()">Simpan Produk</button>

<div id="status"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, addDoc, collection } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

/* 🔥 FIREBASE CONFIG (WAJIB SAMA DENGAN INDEX & LOGIN) */
const firebaseConfig = {
  apiKey: "AIzaSyCBTjk3eRMO356ADYTX3sbpY4xDSjJzqK0",
  authDomain: "musicos-studio.firebaseapp.com",
  projectId: "musicos-studio",
  storageBucket: "musicos-studio.appspot.com",
  messagingSenderId: "1025793334771",
  appId: "1:1025793334771:web:b1be41ed205ee0aec80686"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const status = document.getElementById("status");

let currentUser = null;

/* 🔐 CHECK LOGIN */
onAuthStateChanged(auth, (user) => {
  currentUser = user;

  if(!user){
    status.innerText = "❌ Kamu belum login!";
    setTimeout(() => {
      window.location.href = "login.html";
    }, 1500);
  }
});

/* ➕ TAMBAH PRODUK */
window.addProduct = async function(){

  if(!currentUser){
    status.innerText = "❌ Harus login dulu!";
    return;
  }

  const name = document.getElementById("name").value.trim();
  const price = document.getElementById("price").value.trim();
  const image = document.getElementById("image").value.trim();
  const category = document.getElementById("category").value.trim();

  if(!name || !price || !image || !category){
    status.innerText = "❌ Semua field wajib diisi!";
    return;
  }

  try {
    await addDoc(collection(db, "products"), {
      name,
      price,
      image,
      category,
      createdAt: new Date()
    });

    status.innerText = "✅ Produk berhasil ditambahkan!";

    document.getElementById("name").value = "";
    document.getElementById("price").value = "";
    document.getElementById("image").value = "";
    document.getElementById("category").value = "";

  } catch (e) {
    console.log(e);
    status.innerText = "❌ Gagal simpan produk!";
  }
};
</script>

</body>
</html>
