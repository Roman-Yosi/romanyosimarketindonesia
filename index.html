<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roman Yosi Market Indonesia</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#f5f5f5;}

header{
background:#0057b8;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
}

.logo{font-weight:bold;font-size:22px;}

.menu a{
color:white;
text-decoration:none;
margin:0 10px;
font-weight:bold;
}

.hero{
background:linear-gradient(135deg,#0057b8,#00a2ff);
color:white;
text-align:center;
padding:80px 20px;
}

.btn{
display:inline-block;
margin-top:20px;
padding:12px 25px;
background:white;
color:#0057b8;
text-decoration:none;
border-radius:8px;
font-weight:bold;
}

.section{
padding:60px 20px;
text-align:center;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
max-width:1000px;
margin:auto;
}

.card{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.price{color:red;font-weight:bold;margin:10px 0;}

.buy{
display:block;
padding:10px;
background:#0057b8;
color:white;
text-decoration:none;
border-radius:6px;
}
</style>

</head>

<body>

<header>
<div class="logo">RomanYosi Market</div>

<div class="menu">
<a href="#home">Beranda</a>
<a href="#kategori">Kategori</a>
<a href="#toko">Toko</a>
