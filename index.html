<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roman Yosi Market Indonesia</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#f5f5f5;}

header{
background:#0057b8;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
}

.logo{font-weight:bold;font-size:22px;}

.menu a{
color:white;
text-decoration:none;
margin:0 10px;
font-weight:bold;
}

.hero{
background:linear-gradient(135deg,#0057b8,#00a2ff);
color:white;
text-align:center;
padding:80px 20px;
}

.btn{
display:inline-block;
margin-top:20px;
padding:12px 25px;
background:white;
color:#0057b8;
text-decoration:none;
border-radius:8px;
font-weight:bold;
}

.section{
padding:60px 20px;
text-align:center;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
max-width:1000px;
margin:auto;
}

.card{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.price{color:red;font-weight:bold;margin:10px 0;}

.buy{
display:block;
padding:10px;
background:#0057b8;
color:white;
text-decoration:none;
border-radius:6px;
}
</style>

</head>

<body>

<header>
<div class="logo">RomanYosi Market</div>

<div class="menu">
<a href="#home">Beranda</a>
<a href="#kategori">Kategori</a>
<a href="#toko">Toko</a>
<a href="https://instagram.com/kromantv1" target="_blank">Kontak</a>
</div>
</header>

<!-- HERO -->
<section id="home" class="hero">
<h1>Roman Yosi Market Indonesia</h1>
<p>Marketplace Indonesia untuk jual beli produk</p>
<a href="#toko" class="btn">Mulai Belanja</a>
</section>

<!-- KATEGORI -->
<section id="kategori" class="section">
<h2>Kategori</h2>
<p>Elektronik | Fashion | Musik | Digital Product</p>
</section>

<!-- TOKO -->
<section id="toko" class="section">
<h2>Produk Terbaru</h2>

<div class="products" id="productList"></div>
</section>

<!-- 🔥 FIREBASE SCRIPT (SUDAH DIPASANG) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "ISI_API_KEY_KAMU",
  authDomain: "musicos-studio.firebaseapp.com",
  projectId: "musicos-studio",
  storageBucket: "musicos-studio.appspot.com",
  messagingSenderId: "1025793334771",
  appId: "1:1025793334771:web:b1be41ed205ee0aec80686"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const productList = document.getElementById("productList");

async function load() {
  const snap = await getDocs(collection(db, "products"));

  snap.forEach(doc => {
    const data = doc.data();

    productList.innerHTML += `
      <div class="card">
        <h3>${data.name}</h3>
        <img src="${data.image}" style="width:100%;height:150px;object-fit:cover;">
        <p class="price">Rp${data.price}</p>
        <p>${data.category}</p>
        <a href="#" class="buy">Beli Sekarang</a>
      </div>
    `;
  });
}

load();
</script>

</body>
</html>
