<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Admin</title>

<style>
body{
  font-family:Arial;
  background:#f5f5f5;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box{
  background:white;
  padding:25px;
  border-radius:12px;
  width:320px;
  box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h2{
  text-align:center;
  margin-bottom:15px;
}

input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:1px solid #ccc;
  border-radius:6px;
}

button{
  width:100%;
  padding:10px;
  background:#0057b8;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

button:hover{
  background:#004494;
}

#error{
  color:red;
  font-size:13px;
  text-align:center;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="box">
<h2>Login Admin</h2>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

<div id="error"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// 🔥 FIREBASE CONFIG (PAKAI PUNYA KAMU)
const firebaseConfig = {
  apiKey: "AIzaSyCBTjk3eRMO356ADYTX3sbpY4xDSjJzqK0",
  authDomain: "musicos-studio.firebaseapp.com",
  projectId: "musicos-studio",
  storageBucket: "musicos-studio.appspot.com",
  messagingSenderId: "1025793334771",
  appId: "1:1025793334771:web:b1be41ed205ee0aec80686"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = function(){

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const error = document.getElementById("error");

  error.innerText = "";

  if(!email || !password){
    error.innerText = "Email dan password wajib diisi!";
    return;
  }

  signInWithEmailAndPassword(auth, email, password)
    .then(() => {
      alert("Login berhasil!");
      window.location.href = "admin.html";
    })
    .catch((err) => {
      console.log(err);
      error.innerText = err.message;
    });

};
</script>

</body>
</html>
